[package]
name = "rlibphonenumber"
version = "0.3.1"
edition = "2024"

rust-version = "1.88"
authors = ["Vladislav K. https://t.me/vloldik"]
description = "A high-performance Rust port of Google's libphonenumber for parsing, formatting, and validating international phone numbers."
repository = "https://github.com/vloldik/rlibphonenumber"
documentation = "https://docs.rs/rlibphonenumber"
readme.workspace = true
license = "Apache-2.0"
keywords = [
    "phone",
    "phonenumber",
    "libphonenumber",
    "validation",
    "formatting",
]
categories = [
    "parser-implementations",
    "text-processing",
    "internationalization",
]
build = "build/rust_build.rs"

[features]
default = ["global_static"]
global_static = []
serde = ["global_static", "dep:serde"]

[lib]
name = "rlibphonenumber"
path = "src/lib.rs"


[dependencies]
# logging standard in rust
log = "0.4"
# protobuf lib required to use .proto files from assets
protobuf = "3.7"
# optimized concurrent map
dashmap = "5.5"
# just regex package
regex = "1.10"

thiserror = { workspace = true }

# for fast 0-alloc int to string conversion
itoa = "1.0"
# simple macro for single allocation concatenation of strings
fast-cat = "0.1"
# lib for derive enum iteration
strum = { version = "0.26", features = ["derive"] }
# Simple lib to converts any unicode valid chars into decimals 
dec_from_char = "0.2"
rlibphonenumbers_macro = { path = "../rlibphonenumbers_macro", version = "0.1" }
zeroes_itoa = { path = "../zeroes_itoa", version = "0.1" }

serde = { version = "1", optional = true }

rustc-hash = { version = "2.1" }
paste = "1.0"

[build-dependencies]
thiserror = "1.0"
protobuf-codegen = "3.7"

[dev-dependencies]
colog = "1.3"
env_logger = "0.11"
criterion = "0.5"
phonenumber = "0.3"
phonelib = "1.0.3"

[[bench]]
name = "format_bench"
harness = false

[[bench]]
name = "parsing_bench"
harness = false
