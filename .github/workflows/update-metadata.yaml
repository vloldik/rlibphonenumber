name: Update Metadata & Publish

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch: 
    inputs:
      skip_publish:
        description: 'Skip publishing to Crates.io (Dry run)'
        required: false
        type: boolean
        default: false


permissions:
  contents: write
  pull-requests: write

jobs:
  update-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          cache: maven
          java-version: '17'
          distribution: 'temurin'

      - name: Install Protobuf Compiler
        run: sudo apt-get install -y protobuf-compiler

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Metadata
        id: generate_metadata
        run: |
          chmod +x ./tools/scripts/generate_metadata.sh
          ./tools/scripts/generate_metadata.sh --tag latest-supported

      - name: Run Tests
        if: steps.generate_metadata.outputs.changes == 'true'
        run: cargo test

      - name: Publish to Crates.io
        if: |
          steps.generate_metadata.outputs.changes == 'true' && 
          github.event.inputs.skip_publish != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --allow-dirty

      - name: Create Pull Request
        if: steps.generate_metadata.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update metadata to latest and bump version to ${{ steps.generate_metadata.outputs.new_version }}"
          branch: "chore/update-metadata-${{ steps.generate_metadata.outputs.new_version }}"
          title: "chore: Update metadata & Release ${{ steps.generate_metadata.outputs.new_version }} ${{ github.event.inputs.skip_publish == 'true' && '(Dry Run)' || '' }}"
          body: |
            Automated update of libphonenumber metadata.
            
            - Metadata updated using `latest-supported` tag.
            - Version bumped to `${{ steps.generate_metadata.outputs.new_version }}`.
            - `cargo test` passed.
            ${{ github.event.inputs.skip_publish == 'true' && '- **SKIPPED**: Published to crates.io (Dry run mode)' || '- Published to crates.io successfully.' }}
          labels: automated-pr, release
